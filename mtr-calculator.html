<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR 都會票計算器</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        h1 { color: #0066cc; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input { padding: 10px; width: 100%; max-width: 400px; }
        button { background: #0066cc; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0055aa; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #0066cc; color: white; }
        .recommend { background: #e6f0ff; padding: 15px; border-radius: 8px; margin: 20px 0; font-size: 1.1em; }
        .warning { background: #ffe6e6; padding: 15px; border-radius: 8px; color: #c00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚇 MTR 都會票計算器</h1>
        
        <h2>Ticket A (舊票 - 主要給老公週末用)</h2>
        <label>Expiry Date (到期日):</label>
        <input type="date" id="ticketAExpiry">
        
        <label>Remaining Trips (剩餘次數):</label>
        <input type="number" id="ticketARemaining" value="15" min="0">

        <h2>Ticket B (新票 - 你日常使用)</h2>
        <label>Expiry Date (到期日):</label>
        <input type="date" id="ticketBExpiry">
        
        <label>Remaining Trips (剩餘次數):</label>
        <input type="number" id="ticketBRemaining" value="40" min="0">

        <button onclick="calculate()">開始計算</button>

        <div id="output"></div>
    </div>

    <script>
        function calculate() {
            const today = new Date();
            today.setHours(0,0,0,0);

            const aExpiry = new Date(document.getElementById('ticketAExpiry').value);
            const bExpiry = new Date(document.getElementById('ticketBExpiry').value);
            let aRemaining = parseInt(document.getElementById('ticketARemaining').value) || 0;
            let bRemaining = parseInt(document.getElementById('ticketBRemaining').value) || 0;

            if (!aExpiry || !bExpiry) {
                alert("請輸入兩張票的到期日期！");
                return;
            }

            let html = `<h2>計算結果 (由今天開始)</h2>`;
            let currentDate = new Date(today);
            let week = 1;
            let buyDateRecommendation = null;
            let wasteWarning = "";

            html += `<div class="recommend"><strong>目前情況：</strong><br>
                     Ticket A 剩餘: ${aRemaining} 次 | 到期: ${aExpiry.toLocaleDateString('zh-HK')}<br>
                     Ticket B 剩餘: ${bRemaining} 次 | 到期: ${bExpiry.toLocaleDateString('zh-HK')}</div>`;

            while (week <= 8) {
                let weekTripsA = 0;
                let weekTripsB = 0;

                // Weekdays: You use Ticket B (10 trips)
                weekTripsB += 10;

                // Weekend: You use B (2), Husband uses A (2)
                weekTripsB += 2;
                weekTripsA += 2;

                aRemaining -= weekTripsA;
                bRemaining -= weekTripsB;

                const dateStr = currentDate.toLocaleDateString('zh-HK', {month:'short', day:'numeric'});

                html += `<p><strong>第 ${week} 週 (${dateStr})：</strong><br>`;
                html += `Ticket A 用 ${weekTripsA} 次 → 剩 ${Math.max(0, aRemaining)} 次<br>`;
                html += `Ticket B 用 ${weekTripsB} 次 → 剩 ${Math.max(0, bRemaining)} 次</p>`;

                // Check if we should buy new ticket soon
                if (aRemaining <= 6 && !buyDateRecommendation) {
                    buyDateRecommendation = currentDate;
                }

                // Warning if A will expire soon with trips left
                const daysToAExpiry = Math.ceil((aExpiry - currentDate) / (1000*60*60*24));
                if (daysToAExpiry < 7 && aRemaining > 5) {
                    wasteWarning = `⚠️ 注意：Ticket A 將在 ${daysToAExpiry} 日後到期，但仲有 ${aRemaining} 次未用！`;
                }

                currentDate.setDate(currentDate.getDate() + 7);
                week++;
            }

            // Final Recommendation
            html += `<div class="recommend">`;
            if (buyDateRecommendation) {
                html += `<strong>✅ 建議：</strong> 你應該在 <strong>${buyDateRecommendation.toLocaleDateString('zh-HK')}</strong> 或之前買下一張新票 (Ticket B)`;
            } else {
                html += `<strong>目前兩張票都足夠用一段時間。</strong>`;
            }
            html += `</div>`;

            if (wasteWarning) {
                html += `<div class="warning">${wasteWarning}</div>`;
            }

            document.getElementById('output').innerHTML = html;
        }
    </script>
</body>
</html>
